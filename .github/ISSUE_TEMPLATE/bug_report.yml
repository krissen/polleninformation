name: Bug Report
description: Report a bug with Polleninformation EU
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the fields below so we can diagnose the issue quickly.

        **Before submitting**, please check:
        - [ ] The [API Status Page](https://krissen.github.io/polleninformation/) shows my country as available
        - [ ] I read the [Troubleshooting Guide](https://github.com/krissen/polleninformation/blob/HEAD/docs/troubleshooting.md)
        - [ ] I restarted Home Assistant and the issue persists

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
      placeholder: |
        After restarting Home Assistant, all pollen sensors show "unknown" state even though the API status page shows my country as available.
    validations:
      required: true

  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: |
        Settings > Devices & Services > click Polleninformation EU > three-dot menu > About.
      placeholder: "2025.6.10"
    validations:
      required: true

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: Settings > About, or the version number at the bottom of the sidebar.
      placeholder: "2026.3.4"
    validations:
      required: true

  - type: input
    id: country-location
    attributes:
      label: Country and location
      description: |
        Which country did you select, and what coordinates or place name did you configure?
        (You can approximate coordinates for privacy, e.g. "Sweden, ~59.3, ~18.1".)
      placeholder: "Sweden, Stockholm (~59.3, ~18.1)"
    validations:
      required: true

  - type: dropdown
    id: api-key-status
    attributes:
      label: API key status
      description: Has your API key worked before?
      options:
        - Was working, stopped working
        - Never worked
        - Working (issue is not related to data fetching)
    validations:
      required: true

  - type: textarea
    id: entity-ids
    attributes:
      label: Sensor entity IDs
      description: |
        Go to Developer Tools > States (Settings > Developer Tools > States in HA 2026.2+).
        Search for "polleninformation" and copy a few example entity IDs with their current state.
      placeholder: |
        sensor.polleninformation_stockholm_birch — unknown
        sensor.polleninformation_stockholm_grasses — 2
    validations:
      required: false

  - type: textarea
    id: ha-logs
    attributes:
      label: Home Assistant log errors
      description: |
        Settings > System > Logs. Search for "polleninformation" and copy relevant entries.
        For more detail, enable debug logging (see the Troubleshooting Guide).
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help (screenshots, steps to reproduce, things you already tried).
    validations:
      required: false
