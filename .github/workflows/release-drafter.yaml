name: Release Drafter

on:
  push:
    branches:
      - master

jobs:
  update_release_draft:
    name: Update release draft
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: release-drafter/release-drafter@4d75298e00d9e34c483e5ff8c68d0ea1c1940c1e  # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


