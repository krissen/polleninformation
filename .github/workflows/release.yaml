name: Release

on:
  release:
    types: [published, prereleased]

jobs:
  release_zip_file:
    name: Prepare release asset
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Get version
        id: version
        uses: home-assistant/actions/helpers/version@a7c616ce81ccda50150bf1595786c71b1883fabb  # master 2026-08-03

      - name: "Set version number"
        run: |
          python3 ${{ github.workspace }}/manage/update_manifest.py --version ${{ steps.version.outputs.version }}

      - name: Create zip
        run: |
          cd custom_components/polleninformation
          zip polleninformation.zip -r ./

      - name: Upload zip to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de  # v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./custom_components/polleninformation/polleninformation.zip
          asset_name: polleninformation.zip
          tag: ${{ github.ref_name }}
          overwrite: true
